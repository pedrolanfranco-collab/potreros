<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3a24">
<title>Tablero de Campos</title>
<!--
  Tablero de Campos (4/11/2026, a pedido de Pedro). Página suelta de SOLO LECTURA para la PC, al estilo del portal
  de FieldData: mapa grande con los potreros pintados por carga, tarjetas de totales, panel de detalle y tabla.
  NO es una app generada por template/generar.js y NO escribe nada en Supabase.
  Lee `stock_potreros` (la foto del stock que publican las apps) de los campos de config.js, por campo o todos juntos.
  Qué campos se ven, sus nombres, la clave, Supabase y los cortes de carga salen de tablero-campos/config.js: para otro
  establecimiento se cambia ese archivo y se corre `node tablero-campos/generar.js`, que lo pega en index.html (TABLERO)
  junto con los dibujos de los potreros. tests/probar_tablero_campos.js falla si index.html se desfasa.
  Potreros agregados en un equipo con "Importar KML/KMZ" (localStorage `<campo>_potreros_nuevos` y
  `<campo>_limites_potreros`) también se dibujan si están en este navegador.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous" />
<style>
:root{
  --fondo:#f3ecd9; --tarjeta:#fffdf6; --texto:#2a2a22; --suave:#5d5a4a; --borde:#d9cfb2;
  --verde:#2b3a24; --verde-claro:#e3ecd6; --rojo:#a8321f; --rojo-claro:#f7dcd5;
  --ocre:#8f5f12; --ocre-claro:#f6e8c4; --gris-claro:#ece6d3;
  --c0:#9a9a8c; --c1:#cfe3a8; --c2:#7fb04f; --c3:#e0a62a; --c4:#c2452d;
  --mapa-alto: 62vh; --panel-ancho: 360px;
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#171a14; --tarjeta:#21261c; --texto:#ece8d8; --suave:#aaa68f; --borde:#3a4132;
    --verde:#9cc47a; --verde-claro:#2b3a24; --rojo:#ff9b86; --rojo-claro:#4a231b;
    --ocre:#e2b24f; --ocre-claro:#46361a; --gris-claro:#2c3225; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:1100;background:var(--fondo);border-bottom:1px solid var(--borde);padding:10px 20px}
.fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entre{justify-content:space-between}
h1{font-size:20px;margin:0}
select,button,input{font:inherit;color:inherit}
.campos{display:flex;gap:6px}
.campo-btn{min-height:40px;padding:0 14px;border:2px solid var(--borde);background:var(--tarjeta);border-radius:10px;font-weight:600;cursor:pointer}
.campo-btn[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:var(--fondo)}
select{padding:6px 10px;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);min-height:40px}
.icono{border:2px solid var(--borde);background:var(--tarjeta);border-radius:10px;min-width:40px;min-height:40px;cursor:pointer}
#estado{font-size:13px;color:var(--suave);margin:4px 0 0}
#estado.mal{color:var(--rojo);font-weight:600}
main{padding:14px 20px 30px}
#clave-aviso{background:var(--ocre-claro);border:2px solid var(--ocre);border-radius:12px;padding:10px 12px;margin:0 0 12px}
#clave-aviso p{margin:0 0 8px}
#clave-input{flex:1;max-width:320px;padding:6px 10px;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);min-height:40px}
#clave-guardar{border:2px solid var(--verde);background:var(--verde);color:var(--fondo);border-radius:10px;min-height:40px;padding:0 16px;font-weight:600;cursor:pointer}
#clave-error{color:var(--rojo);font-size:13px;margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--tarjeta);border:2px solid var(--borde);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.kpi small{display:block;font-size:12px;color:var(--suave);margin-top:2px}
.cuerpo{display:grid;grid-template-columns:1fr var(--panel-ancho);gap:14px}
.mapa-caja{background:var(--tarjeta);border:2px solid var(--borde);border-radius:12px;overflow:hidden;position:relative}
#map{height:var(--mapa-alto);min-height:320px;background:#d8d2bd}
.mapa-barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--borde);font-size:13px}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.25)}
.panel{background:var(--tarjeta);border:2px solid var(--borde);border-radius:12px;padding:12px 14px;max-height:calc(var(--mapa-alto) + 46px);overflow:auto}
.panel h2{font-size:18px;margin:0 0 2px}
.panel .sub{color:var(--suave);font-size:13px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mini div{background:var(--gris-claro);border-radius:10px;padding:6px 8px;text-align:center}
.mini b{display:block;font-size:20px}
.mini span{font-size:11px;color:var(--suave)}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:14px 0 6px}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{text-align:left;font-size:12px;color:var(--suave);font-weight:600;padding:6px;border-bottom:2px solid var(--borde);cursor:pointer;user-select:none;white-space:nowrap}
.tabla td{padding:6px;border-top:1px solid var(--borde)}
.tabla td.n,.tabla th.n{text-align:right}
.tabla tr.fila-pot{cursor:pointer}
.tabla tr.fila-pot:hover,.tabla tr.sel{background:var(--verde-claro)}
.punto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
.vacio{color:var(--suave);text-align:center;padding:24px 0}
.abajo{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.caja{background:var(--tarjeta);border:2px solid var(--borde);border-radius:12px;padding:10px 14px}
.caja h2{font-size:15px;margin:2px 0 8px}
.etq{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--gris-claro);margin-left:4px}
.etq.ocre{background:var(--ocre-claro);color:var(--ocre)}
.leaflet-tooltip.etiqueta{background:rgba(255,253,246,.85);border:0;box-shadow:none;font-weight:700;font-size:12px;padding:1px 5px;color:#2a2a22}
.leaflet-tooltip.etiqueta::before{display:none}
[hidden]{display:none!important}
@media (max-width: 1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cuerpo,.abajo{grid-template-columns:1fr}
  .panel{max-height:none}
}
</style>
</head>
<body>
<header>
  <div class="fila entre">
    <h1>🗺️ <span id="titulo">Tablero de Campos</span> <span id="version" class="etq">v1.0</span></h1>
    <div class="fila">
      <div class="campos" id="campos" role="group" aria-label="Campo"></div>
      <select id="dueno" aria-label="Dueño o firma"></select>
      <button id="refrescar" class="icono" title="Actualizar ahora" aria-label="Actualizar ahora">⟳</button>
    </div>
  </div>
  <p id="estado">Cargando…</p>
</header>
<main>
  <div id="clave-aviso" hidden>
    <p id="clave-msg"></p>
    <div class="fila">
      <input id="clave-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Clave del campo" aria-label="Clave del campo">
      <button id="clave-guardar">Guardar</button>
    </div>
    <p id="clave-error" hidden></p>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="cuerpo">
    <div class="mapa-caja">
      <div id="map"></div>
      <div class="mapa-barra">
        <label>Pintar por
          <select id="color-por">
            <option value="carga">Carga (UG/ha)</option>
            <option value="cabezas">Cabezas</option>
            <option value="ocupado">Con / sin animales</option>
          </select>
        </label>
        <div class="leyenda" id="leyenda"></div>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </section>

  <section class="abajo">
    <div class="caja">
      <h2>Potreros</h2>
      <table class="tabla" id="tabla-pot"></table>
    </div>
    <div class="caja">
      <h2>Por categoría</h2>
      <table class="tabla" id="tabla-cat"></table>
    </div>
  </section>
</main>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('es-UY', { minimumFractionDigits: d, maximumFractionDigits: d });
const norm = s => String(s == null ? '' : s).trim().toLowerCase();

/* ---------- superficie ---------- */
/* Área de un polígono [lat,lon] en hectáreas (aproximación esférica; sirve para potreros de pocos km). */
function areaHa(coords){
  if(!Array.isArray(coords) || coords.length < 3) return 0;
  const R = 6378137, rad = Math.PI / 180;
  let s = 0;
  for(let i = 0; i < coords.length; i++){
    const [la1, lo1] = coords[i], [la2, lo2] = coords[(i + 1) % coords.length];
    s += (lo2 - lo1) * rad * (2 + Math.sin(la1 * rad) + Math.sin(la2 * rad));
  }
  return Math.abs(s * R * R / 2) / 10000;
}
/* Igual criterio que las apps: al menos 3 puntos [lat, lon] numéricos. Lo de localStorage puede venir roto. */
function coordsValidas(c){
  return Array.isArray(c) && c.length >= 3 && c.every(q => Array.isArray(q) && q.length >= 2 && isFinite(q[0]) && isFinite(q[1]) &&
    Math.abs(q[0]) <= 90 && Math.abs(q[1]) <= 180);
}
function leerLS(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
/* Potreros de un campo: los del repo + los que este navegador tenga importados o corregidos. */
function potrerosDe(campo){
  const base = (GEO[campo] || []).map(p => ({ nombre: p.nombre, area: p.area, coords: p.coords }));
  const limites = leerLS(campo + '_limites_potreros') || {};
  for(const p of base){ const l = limites && limites[p.nombre]; if(l && coordsValidas(l.coords)){ p.coords = l.coords; p.area = l.area; } }
  const nuevos = leerLS(campo + '_potreros_nuevos');
  if(Array.isArray(nuevos)) for(const n of nuevos){
    if(n && typeof n.nombre === 'string' && n.nombre.trim() && coordsValidas(n.coords) && !base.some(p => norm(p.nombre) === norm(n.nombre)))
      base.push({ nombre: n.nombre, area: n.area, coords: n.coords });
  }
  for(const p of base){
    if(!coordsValidas(p.coords)) p.coords = null;
    const a = parseFloat(String(p.area == null ? '' : p.area).replace(',', '.'));
    if(a > 0){ p.ha = a; p.haCalculada = false; } else { p.ha = areaHa(p.coords); p.haCalculada = true; }
  }
  return base;
}

/* ---------- clave del campo (igual que tablero-sanidad) ---------- */
function claveDe(campo){
  if(!CON_CLAVE[campo]) return '';
  try{ const c = String(localStorage.getItem('clave_campo_' + campo) || '').trim().toLowerCase(); return CLAVE_RE.test(c) ? c : ''; }
  catch(e){ return ''; }
}
function cab(campo){ const h = { apikey: SUPABASE_ANON_KEY }; const c = claveDe(campo); if(c) h['x-clave-campo'] = c; return h; }
async function verificarClave(campo, clave){
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/verificar_clave', { method: 'POST', cache: 'no-store',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ est: campo, clave }) });
    if(!r.ok) return 'sin_respuesta';
    const v = await r.json();
    return v === true ? 'ok' : v === false ? 'mala' : 'sin_respuesta';
  }catch(e){ return 'sin_respuesta'; }
}
const claveMala = {};          // campo -> true si el servidor dijo que la clave guardada no sirve
const claveVerificada = {};    // campo + clave -> 'ok' | 'mala' (respuesta definitiva del servidor)
async function verificarGuardada(campo){
  const c = claveDe(campo);
  if(!c || claveVerificada[campo + c]) return;
  const r = await verificarClave(campo, c);
  if(r === 'sin_respuesta') return;
  claveVerificada[campo + c] = r;
  claveMala[campo] = (r === 'mala');
}
function camposVisibles(){ return elegido === 'todos' ? CAMPOS : [elegido]; }
function campoSinClave(){ return camposVisibles().find(c => CON_CLAVE[c] && (!claveDe(c) || claveMala[c])) || null; }
function pintarAvisoClave(){
  const c = campoSinClave();
  $('clave-msg').textContent = !c ? '' : claveDe(c) ? '🔑 La clave guardada de ' + NOMBRE_CAMPO[c] + ' ya no sirve. Escribí la nueva.'
    : '🔑 Falta la clave de ' + NOMBRE_CAMPO[c] + '. Escribila una vez para ver sus datos.';
  $('clave-aviso').hidden = !c;
  $('clave-aviso').dataset.campo = c || '';
}
function errorClave(t){ $('clave-error').textContent = t || ''; $('clave-error').hidden = !t; }
async function guardarClave(){
  const campo = $('clave-aviso').dataset.campo;
  const c = String($('clave-input').value || '').trim().toLowerCase();
  errorClave('');
  if(!campo) return;
  if(!CLAVE_RE.test(c)){ errorClave('La clave tiene solo letras (sin tildes ni ñ) y números, sin espacios, y al menos 8 caracteres.'); return; }
  $('clave-guardar').disabled = true;
  try{
    const r = await verificarClave(campo, c);
    if(r === 'sin_respuesta'){ errorClave('No se pudo comprobar la clave ahora. Probá de nuevo con conexión.'); return; }
    if(r === 'mala'){ errorClave('Esa no es la clave de ' + NOMBRE_CAMPO[campo] + '.'); return; }
    try{ localStorage.setItem('clave_campo_' + campo, c); }catch(e){ errorClave('No se pudo guardar la clave en este equipo.'); return; }
    claveMala[campo] = false; claveVerificada[campo + c] = 'ok';
    $('clave-input').value = '';
    pintarAvisoClave();
    actualizar();
  }finally{ $('clave-guardar').disabled = false; }
}

/* ---------- lectura ---------- */
async function pedirStock(campo){
  const filas = [];
  for(let desde = 0; desde < 20000; desde += 1000){
    const url = SUPABASE_URL + '/rest/v1/stock_potreros?select=potrero,categoria,dueno,cantidad,ug,especie,actualizado_en' +
      '&establecimiento=eq.' + encodeURIComponent(campo) + '&order=potrero.asc,clave.asc&limit=1000&offset=' + desde;
    const r = await fetch(url, { headers: cab(campo), cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const lote = await r.json();
    if(!Array.isArray(lote)) throw new Error('respuesta inesperada');
    filas.push(...lote);
    if(lote.length < 1000) break;
  }
  return filas.filter(f => Number(f.cantidad) !== 0 && f.potrero != null && String(f.potrero).trim() !== '');
}
let stock = {};        // campo -> { filas, leido }
let errores = {};      // campo -> texto
function leerCache(){
  const c = leerLS(CACHE_LS);
  if(c && typeof c === 'object') for(const k of CAMPOS) if(c[k] && Array.isArray(c[k].filas)) stock[k] = c[k];
}
function guardarCache(){ try{ localStorage.setItem(CACHE_LS, JSON.stringify(stock)); }catch(e){} }

let leyendo = false, pendiente = false;
async function actualizar(){
  if(leyendo){ pendiente = true; return; }   // se vuelve a leer al terminar (campo recién elegido o clave recién guardada)
  leyendo = true; pendiente = false;
  $('estado').textContent = 'Leyendo…'; $('estado').className = '';
  await Promise.all(camposVisibles().map(async campo => {
    if(CON_CLAVE[campo] && !claveDe(campo)){ errores[campo] = 'falta la clave'; return; }
    try{
      const filas = await pedirStock(campo);
      /* Con clave mala las políticas contestan 200 SIN FILAS. Si el campo usa clave y no está confirmada como buena,
         una lectura vacía no pisa la copia guardada. Si la clave está confirmada (o el campo no usa clave), vacío es vacío. */
      if(!filas.length && CON_CLAVE[campo]){
        await verificarGuardada(campo);
        if(claveVerificada[campo + claveDe(campo)] !== 'ok'){
          errores[campo] = claveMala[campo] ? 'la clave guardada ya no sirve' : 'lectura vacía sin poder confirmar la clave';
          return;
        }
      }
      stock[campo] = { filas, leido: new Date().toISOString() };
      delete errores[campo];
    }catch(e){ errores[campo] = 'sin conexión (' + e.message + ')'; }
  }));
  guardarCache();
  leyendo = false;
  pintar();
  if(pendiente) actualizar();
}

/* ---------- cálculo ---------- */
let elegido = CAMPOS[0];
let duenoFiltro = '';
let seleccion = null;   // {campo, nombre}
let orden = { col: 'carga', desc: true };

function todasFilasDe(campo){ return (stock[campo] && stock[campo].filas) || []; }
function filasDe(campo){
  const f = todasFilasDe(campo);
  return duenoFiltro ? f.filter(x => norm(x.dueno) === norm(duenoFiltro)) : f;
}
/* Lista de potreros (con mapa o no) con sus números. */
function armarPotreros(){
  const lista = [];
  for(const campo of camposVisibles()){
    const geo = potrerosDe(campo);
    const porNombre = {};
    for(const p of geo){
      const it = { campo, nombre: p.nombre, ha: p.ha, haCalculada: p.haCalculada, coords: p.coords, cabezas: 0, ug: 0, ugTotal: 0, filas: [] };
      porNombre[norm(p.nombre)] = it; lista.push(it);
    }
    for(const f of filasDe(campo)){
      let it = porNombre[norm(f.potrero)];
      if(!it){ it = { campo, nombre: String(f.potrero), ha: 0, haCalculada: false, coords: null, cabezas: 0, ug: 0, ugTotal: 0, filas: [] }; porNombre[norm(f.potrero)] = it; lista.push(it); }
      it.cabezas += Number(f.cantidad) || 0;
      it.ug += Number(f.ug) || 0;
      it.filas.push(f);
    }
    /* La carga del potrero es SIEMPRE con todos los animales, aunque haya filtro de dueño: el pasto lo comen todos. */
    for(const f of todasFilasDe(campo)){ const it = porNombre[norm(f.potrero)]; if(it){ it.ugTotal += Number(f.ug) || 0; it.cabezasTotal = (it.cabezasTotal || 0) + (Number(f.cantidad) || 0); } }
    /* Potreros dobles (1+2, 19+20): el doble solo cuenta si tiene animales; entonces sus partes quedan "tapadas" (apagadas en
       el mapa y fuera de la superficie total, que ya suma el doble). Un doble vacío no aparece. */
    const dobles = DOBLES[campo] || {};
    for(const d of Object.keys(dobles)){
      const it = porNombre[norm(d)];
      if(!it) continue;
      it.partes = dobles[d];
      if(!it.cabezasTotal){ lista.splice(lista.indexOf(it), 1); continue; }
      for(const parte of dobles[d]){ const pt = porNombre[norm(parte)]; if(pt && !pt.cabezasTotal) pt.tapada = it.nombre; }   // una parte con animales propios sigue contando
    }
  }
  for(const it of lista) it.carga = it.ha > 0 ? it.ugTotal / it.ha : null;
  return lista;
}
function totales(lista){
  const t = { cabezas: 0, ug: 0, ha: 0, ugMapa: 0, ocupados: 0, total: 0, sinMapa: 0 };
  for(const it of lista){
    t.cabezas += it.cabezas; t.ug += it.ug;
    if(it.tapada) continue;   // parte de un doble en uso: el doble ya cuenta su superficie
    if(it.coords && it.ha > 0){ t.ha += it.ha; t.ugMapa += it.ugTotal; t.total++; if(it.cabezas > 0) t.ocupados++; }
    else if(it.cabezas) t.sinMapa++;
  }
  /* Carga = UG de los potreros dibujados / sus hectáreas (los "sin mapa" no tienen superficie). */
  t.carga = t.ha > 0 ? t.ugMapa / t.ha : null;
  return t;
}
function colorDe(it, maxCab){
  const modo = $('color-por').value;
  if(!it.cabezas) return COLOR_VACIO;
  if(modo === 'ocupado') return COLORES[1];
  if(modo === 'cabezas'){ const r = it.cabezas / (maxCab || 1); return COLORES[r < .25 ? 0 : r < .5 ? 1 : r < .75 ? 2 : 3]; }
  if(it.carga == null) return COLORES[1];
  const i = CORTES_CARGA.findIndex(c => it.carga < c);
  return COLORES[i === -1 ? 3 : i];
}
function pintarLeyenda(maxCab){
  const modo = $('color-por').value;
  const cuad = (c, t) => '<span><i style="background:' + c + '"></i>' + t + '</span>';
  let h = cuad(COLOR_VACIO, 'Sin animales');
  if(modo === 'ocupado') h += cuad(COLORES[1], 'Con animales');
  else if(modo === 'cabezas'){ const q = n => fmt(maxCab * n); h += cuad(COLORES[0], 'hasta ' + q(.25)) + cuad(COLORES[1], q(.25) + '–' + q(.5)) + cuad(COLORES[2], q(.5) + '–' + q(.75)) + cuad(COLORES[3], 'más de ' + q(.75)); }
  else { const [a, b, c] = CORTES_CARGA.map(x => fmt(x, 1)); h += cuad(COLORES[0], 'menos de ' + a) + cuad(COLORES[1], a + '–' + b) + cuad(COLORES[2], b + '–' + c) + cuad(COLORES[3], 'más de ' + c + ' UG/ha'); }
  $('leyenda').innerHTML = h;
}

/* ---------- mapa ---------- */
let map = null, capa = null, ultimoEncuadre = '';
function iniciarMapa(){
  map = L.map('map', { zoomControl: true });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' }).addTo(map);
  capa = L.layerGroup().addTo(map);
  map.setView([-31.4, -55.6], 10);
}
function maxCabezas(lista){ return lista.reduce((m, i) => Math.max(m, i.cabezas), 1); }
function pintarMapa(lista){
  const maxCab = maxCabezas(lista);
  pintarLeyenda(maxCab);
  if(!map) return;
  capa.clearLayers();
  const limites = [];
  const etiquetas = elegido !== 'todos' && lista.filter(i => i.coords).length <= 40;   // en Todos los campos quedan lejos y las etiquetas se pisan
  for(const it of lista){
    if(!it.coords) continue;
    try{
    const sel = seleccion && seleccion.campo === it.campo && seleccion.nombre === it.nombre;
    const pol = it.tapada && !sel
      ? L.polygon(it.coords, { color: '#1d2418', weight: 1, dashArray: '4 4', fillColor: COLOR_VACIO, fillOpacity: .08 })
      : L.polygon(it.coords, { color: sel ? '#ffffff' : '#1d2418', weight: sel ? 4 : 1.5, fillColor: colorDe(it, maxCab), fillOpacity: .6 });
    if(it.tapada && !sel){ pol.on('click', () => elegirPotrero(it.campo, it.tapada)); capa.addLayer(pol); limites.push(...it.coords); continue; }
    pol.on('click', () => elegirPotrero(it.campo, it.nombre));
    pol.bindTooltip(esc(it.nombre) + (elegido === 'todos' ? ' (' + esc(NOMBRE_CAMPO[it.campo]) + ')' : '') + (it.cabezas ? ' · ' + fmt(it.cabezas) : ''), etiquetas ? { permanent: true, direction: 'center', className: 'etiqueta' } : { sticky: true });
    capa.addLayer(pol);
    limites.push(...it.coords);
    }catch(e){ /* un polígono roto no deja el tablero en blanco */ }
  }
  const clave = elegido + '|' + limites.length;
  if(limites.length && clave !== ultimoEncuadre){ map.fitBounds(L.latLngBounds(limites), { padding: [20, 20] }); ultimoEncuadre = clave; }
}

/* ---------- pintado ---------- */
function haTxt(it){ return it.ha > 0 ? (it.haCalculada ? '≈' : '') + fmt(it.ha) : '—'; }
function pintarKpis(t){
  const campos = camposVisibles();
  const ult = campos.map(c => stock[c] && stock[c].filas && stock[c].filas.reduce((m, f) => (Date.parse(f.actualizado_en) || 0) > (Date.parse(m) || 0) ? f.actualizado_en : m, '')).filter(Boolean)
    .sort((a, b) => Date.parse(a) - Date.parse(b)).pop();
  $('kpis').innerHTML =
    '<div class="kpi"><span>Cabezas</span><b>' + fmt(t.cabezas) + '</b><small>' + (duenoFiltro ? esc(duenoFiltro) : 'todas') + '</small></div>' +
    '<div class="kpi"><span>UG</span><b>' + fmt(t.ug, 1) + '</b><small>unidades ganaderas</small></div>' +
    '<div class="kpi"><span>Carga</span><b>' + fmt(t.carga, 2) + '</b><small>UG/ha sobre ' + fmt(t.ha) + ' ha' + (duenoFiltro ? ', con todos los dueños' : '') + '</small></div>' +
    '<div class="kpi"><span>Potreros con animales</span><b>' + t.ocupados + ' / ' + t.total + '</b><small>' + (t.sinMapa ? t.sinMapa + ' sin dibujo en el mapa' : 'todos en el mapa') + '</small></div>' +
    '<div class="kpi"><span>Último dato</span><b style="font-size:20px">' + (ult ? fechaHora(ult) : '—') + '</b><small>publicado por las apps</small></div>';
}
function fechaHora(iso){ const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('es-UY', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }); }
function agruparCat(filas){
  const m = {};
  for(const f of filas){
    const k = (f.especie ? f.especie + '|' : '|') + f.categoria;
    const x = m[k] = m[k] || { especie: f.especie || '', categoria: f.categoria, cabezas: 0, ug: 0 };
    x.cabezas += Number(f.cantidad) || 0; x.ug += Number(f.ug) || 0;
  }
  return Object.values(m).sort((a, b) => b.cabezas - a.cabezas);
}
function tablaCat(filas, conDueno){
  if(!filas.length) return '<tr><td class="vacio">Sin animales</td></tr>';
  if(conDueno){
    const s = filas.slice().sort((a, b) => (Number(b.cantidad) || 0) - (Number(a.cantidad) || 0));
    return '<tr><th>Categoría</th><th>Dueño / firma</th><th class="n">Cab.</th><th class="n">UG</th></tr>' +
      s.map(f => '<tr><td>' + esc(f.categoria) + '</td><td>' + esc(f.dueno || '—') + '</td><td class="n">' + fmt(f.cantidad) + '</td><td class="n">' + fmt(f.ug, 1) + '</td></tr>').join('');
  }
  return '<tr><th>Categoría</th><th class="n">Cab.</th><th class="n">UG</th></tr>' +
    agruparCat(filas).map(c => '<tr><td>' + esc(c.categoria) + (c.especie ? ' <span class="etq">' + esc(c.especie) + '</span>' : '') + '</td><td class="n">' + fmt(c.cabezas) + '</td><td class="n">' + fmt(c.ug, 1) + '</td></tr>').join('');
}
function pintarPanel(lista, t){
  const it = seleccion && lista.find(i => i.campo === seleccion.campo && i.nombre === seleccion.nombre);
  if(!it){
    const porCampo = elegido === 'todos' ? CAMPOS.map(c => { const tt = totales(lista.filter(i => i.campo === c)); return '<tr class="fila-campo" data-campo="' + c + '"><td>' + esc(NOMBRE_CAMPO[c]) + '</td><td class="n">' + fmt(tt.cabezas) + '</td><td class="n">' + fmt(tt.ug, 1) + '</td><td class="n">' + fmt(tt.carga, 2) + '</td></tr>'; }).join('') : '';
    $('panel').innerHTML = '<h2>' + esc(NOMBRE_CAMPO[elegido]) + '</h2><div class="sub">Hacé clic en un potrero del mapa o de la tabla para ver el detalle.</div>' +
      (porCampo ? '<h3>Por campo</h3><table class="tabla"><tr><th>Campo</th><th class="n">Cab.</th><th class="n">UG</th><th class="n">UG/ha</th></tr>' + porCampo + '</table>' : '') +
      '<h3>Potreros con más carga</h3><table class="tabla">' +
      lista.filter(i => i.cabezas && i.carga != null).sort((a, b) => b.carga - a.carga).slice(0, 6).map(i =>
        '<tr class="fila-pot" data-campo="' + i.campo + '" data-nombre="' + esc(i.nombre) + '"><td><span class="punto" style="background:' + colorDe(i, maxCabezas(lista)) + '"></span>' + esc(i.nombre) + (elegido === 'todos' ? ' <span class="etq">' + esc(NOMBRE_CAMPO[i.campo]) + '</span>' : '') + '</td><td class="n">' + fmt(i.carga, 2) + ' UG/ha</td></tr>').join('') + '</table>';
    return;
  }
  $('panel').innerHTML = '<h2>' + esc(it.nombre) + '</h2><div class="sub">' + esc(NOMBRE_CAMPO[it.campo]) + ' · ' + haTxt(it) + ' ha' + (it.haCalculada && it.ha ? ' (medida del dibujo)' : '') + (!it.coords ? ' · <span class="etq ocre">sin dibujo en el mapa</span>' : '') + '</div>' +
    '<div class="mini"><div><b>' + fmt(it.cabezas) + '</b><span>cabezas</span></div><div><b>' + fmt(it.ug, 1) + '</b><span>UG</span></div><div><b>' + fmt(it.carga, 2) + '</b><span>UG/ha</span></div></div>' +
    '<h3>Animales</h3><table class="tabla">' + tablaCat(it.filas, true) + '</table>' +
    '<p style="margin-top:12px"><button class="icono" id="cerrar-sel" style="padding:0 12px">← Volver al resumen</button></p>';
  $('cerrar-sel').onclick = () => { seleccion = null; pintar(); };
}
function pintarTablaPot(lista){
  const cols = [['nombre', 'Potrero', false], ...(elegido === 'todos' ? [['campo', 'Campo', false]] : []), ['ha', 'ha', true], ['cabezas', 'Cabezas', true], ['ug', 'UG', true], ['carga', 'UG/ha', true]];
  const val = (i, c) => c === 'campo' ? NOMBRE_CAMPO[i.campo] : c === 'nombre' ? i.nombre : i[c];
  const s = lista.slice().sort((a, b) => {
    const x = val(a, orden.col), y = val(b, orden.col);
    const r = (typeof x === 'number' || typeof y === 'number') ? (x ?? -1) - (y ?? -1) : String(x).localeCompare(String(y), 'es', { numeric: true });
    return (orden.desc ? -r : r) || String(a.nombre).localeCompare(String(b.nombre), 'es', { numeric: true });
  });
  const maxCab = maxCabezas(lista);
  const flecha = c => orden.col === c ? (orden.desc ? ' ▾' : ' ▴') : '';
  $('tabla-pot').innerHTML = '<tr>' + cols.map(([c, t, n]) => '<th data-col="' + c + '"' + (n ? ' class="n"' : '') + '>' + t + flecha(c) + '</th>').join('') + '</tr>' +
    (s.length ? s.map(i => {
      const sel = seleccion && seleccion.campo === i.campo && seleccion.nombre === i.nombre;
      return '<tr class="fila-pot' + (sel ? ' sel' : '') + '" data-campo="' + i.campo + '" data-nombre="' + esc(i.nombre) + '"><td><span class="punto" style="background:' + colorDe(i, maxCab) + '"></span>' + esc(i.nombre) + (!i.coords ? ' <span class="etq ocre">sin mapa</span>' : '') + (i.partes ? ' <span class="etq">🔗 ' + esc(i.partes.join(' y ')) + ' unidos</span>' : '') + (i.tapada ? ' <span class="etq">🔗 unido en ' + esc(i.tapada) + '</span>' : '') + '</td>' +
        (elegido === 'todos' ? '<td>' + esc(NOMBRE_CAMPO[i.campo]) + '</td>' : '') +
        '<td class="n">' + haTxt(i) + '</td><td class="n">' + fmt(i.cabezas) + '</td><td class="n">' + fmt(i.ug, 1) + '</td><td class="n">' + fmt(i.carga, 2) + '</td></tr>';
    }).join('') : '<tr><td class="vacio" colspan="6">Sin potreros cargados</td></tr>');
}
function pintarDuenos(){
  const vals = new Set();
  for(const c of camposVisibles()) for(const f of ((stock[c] && stock[c].filas) || [])) if(f.dueno) vals.add(f.dueno);
  const lista = [...vals].sort((a, b) => a.localeCompare(b, 'es'));
  if(duenoFiltro && !lista.some(d => norm(d) === norm(duenoFiltro))) duenoFiltro = '';
  const etq = elegido === 'todos' ? 'Dueño / firma' : ETQ_DUENO[elegido];
  $('dueno').innerHTML = '<option value="">' + esc(etq) + ': todos</option>' + lista.map(d => '<option' + (d === duenoFiltro ? ' selected' : '') + '>' + esc(d) + '</option>').join('');
  $('dueno').hidden = !lista.length;
}
function pintarEstado(){
  const malos = camposVisibles().filter(c => errores[c]);
  if(malos.length){
    $('estado').textContent = '⚠ ' + malos.map(c => NOMBRE_CAMPO[c] + ': ' + errores[c]).join(' · ') + (malos.some(c => stock[c]) ? ' — se muestra la última copia guardada.' : '');
    $('estado').className = 'mal';
  } else {
    const l = camposVisibles().map(c => stock[c] && stock[c].leido).filter(Boolean).sort()[0];
    $('estado').textContent = l ? 'Leído ' + fechaHora(l) + ' · se actualiza solo cada 5 minutos.' : 'Sin datos todavía.';
    $('estado').className = '';
  }
}
function pintar(){
  document.querySelectorAll('.campo-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.campo === elegido)));
  pintarDuenos();
  pintarAvisoClave();
  const lista = armarPotreros();
  const t = totales(lista);
  for(const paso of [() => pintarKpis(t), () => pintarMapa(lista), () => pintarPanel(lista, t), () => pintarTablaPot(lista),
                     () => { $('tabla-cat').innerHTML = tablaCat(camposVisibles().flatMap(filasDe), false); }, pintarEstado]){
    try{ paso(); }catch(e){ console.error('tablero-campos:', e); }   // un paso que falla no borra los demás
  }
}
function elegirPotrero(campo, nombre){
  seleccion = (seleccion && seleccion.campo === campo && seleccion.nombre === nombre) ? null : { campo, nombre };
  pintar();
}
function elegirCampo(c){
  elegido = c; seleccion = null; duenoFiltro = '';
  if(orden.col === 'campo') orden = { col: 'carga', desc: true };
  try{ localStorage.setItem(ELEGIDO_LS, c); }catch(e){}
  pintar();
  actualizar();
}

/* ---------- arranque ---------- */
function iniciar(){
  try{ const g = localStorage.getItem(ELEGIDO_LS); if(g && (CAMPOS.includes(g) || (g === 'todos' && HAY_TODOS))) elegido = g; }catch(e){}
  $('titulo').textContent = TABLERO.titulo || 'Tablero de Campos';
  $('campos').innerHTML = [...CAMPOS, ...(HAY_TODOS ? ['todos'] : [])]
    .map(c => '<button class="campo-btn" data-campo="' + esc(c) + '">' + esc(NOMBRE_CAMPO[c]) + '</button>').join('');
  $('version').textContent = 'v' + VERSION;
  leerCache();
  try{ iniciarMapa(); }catch(e){ $('map').textContent = 'No se pudo cargar el mapa (sin conexión).'; }
  document.querySelectorAll('.campo-btn').forEach(b => b.addEventListener('click', () => elegirCampo(b.dataset.campo)));
  $('dueno').addEventListener('change', e => { duenoFiltro = e.target.value; pintar(); });
  $('color-por').addEventListener('change', pintar);
  $('refrescar').addEventListener('click', actualizar);
  $('clave-guardar').addEventListener('click', guardarClave);
  $('clave-input').addEventListener('keydown', e => { if(e.key === 'Enter') guardarClave(); });
  document.addEventListener('click', e => {
    const tr = e.target.closest('tr.fila-pot'); if(tr){ elegirPotrero(tr.dataset.campo, tr.dataset.nombre); return; }
    const fc = e.target.closest('tr.fila-campo'); if(fc){ elegirCampo(fc.dataset.campo); return; }
    const th = e.target.closest('#tabla-pot th'); if(th){ const c = th.dataset.col; orden = { col: c, desc: orden.col === c ? !orden.desc : c !== 'nombre' && c !== 'campo' }; pintar(); }
  });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) actualizar(); });
  setInterval(actualizar, REFRESCO_MS);
  pintar();
  actualizar();
}
iniciar();
</script>
</body>
</html>
