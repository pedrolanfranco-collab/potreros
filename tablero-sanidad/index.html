<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c63">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-96x96.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<title>Tablero de Sanidad</title>
<!--
  Tablero de solo lectura (16/10/2026). NO es una de las apps generadas por template/generar.js:
  es un archivo suelto, sin librerías. Lee cuatro tablas:
    sanidad_proximos  (qué tratamiento toca y cuándo)        -- la publica la PC (actualizar_sanidad_supabase.py)
    sanidad_ultimos   (lo último que se aplicó)              -- idem
    stock_potreros    (stock actual por potrero, categoría y dueño/firma) -- la publican las apps
    animales_caravana (padrón por caravana; de ahí sale la GENERACIÓN) -- la publica la PC (publicar_animales.py)
  No escribe nada. Se refresca solo cada 5 min y al volver a la pestaña; guarda la última copia en el
  teléfono para mostrar algo sin señal.
  Clave del campo (Fase 4, 21/10/2026): La Vuelta y María Laura piden la clave del campo; Pone Chico no. El tablero
  vive en el mismo origen que las apps, así que toma la clave que ya se cargó en ellas (localStorage
  `clave_campo_<campo>`); si no está, la pide una vez, la comprueba con verificar_clave y la guarda en esa misma
  posición. La manda en el encabezado `x-clave-campo`. Con las políticas cerradas, una lectura sin clave contesta
  200 SIN FILAS (no un error): por eso, sin clave, no se pisa la última copia con una lectura vacía.
-->
<style>
:root{
  --fondo:#f3ecd9; --tarjeta:#fffdf6; --texto:#2a2a22; --suave:#5d5a4a; --borde:#d9cfb2;
  --verde:#2b3a24; --verde-claro:#e3ecd6; --rojo:#a8321f; --rojo-claro:#f7dcd5;
  --ocre:#8f5f12; --ocre-claro:#f6e8c4; --gris-claro:#ece6d3;
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#171a14; --tarjeta:#21261c; --texto:#ece8d8; --suave:#aaa68f; --borde:#3a4132;
    --verde:#9cc47a; --verde-claro:#2b3a24; --rojo:#ff9b86; --rojo-claro:#4a231b;
    --ocre:#e2b24f; --ocre-claro:#46361a; --gris-claro:#2c3225; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--fondo);padding:calc(12px + env(safe-area-inset-top)) 0 8px;
  border-bottom:1px solid var(--borde)}
.fila{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:19px;margin:0}
select,button{font:inherit;color:inherit}
select{padding:8px 10px;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);min-height:44px}
#refrescar{border:2px solid var(--borde);background:var(--tarjeta);border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
#estado{font-size:13px;color:var(--suave);margin:6px 0 0}
#estado.mal{color:var(--rojo);font-weight:600}
#clave-aviso{background:var(--ocre-claro);border:2px solid var(--ocre);border-radius:12px;padding:10px 12px;margin:12px 0}
#clave-aviso p{margin:0 0 8px}
#clave-aviso .fila{justify-content:flex-start}
#clave-input{flex:1;min-width:0;padding:8px 10px;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);min-height:44px;font-size:16px}
#clave-guardar{border:2px solid var(--verde);background:var(--verde);color:var(--fondo);border-radius:10px;min-height:44px;padding:0 16px;font-weight:600}
#clave-error{color:var(--rojo);font-size:13px;margin:6px 0 0}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;min-height:46px;border:2px solid var(--borde);background:var(--tarjeta);border-radius:12px;font-weight:600}
.tab[aria-selected=true]{background:var(--verde);border-color:var(--verde);color:var(--fondo)}
.resumen{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;border-radius:12px;padding:8px 6px;text-align:center;background:var(--gris-claro)}
.chip b{display:block;font-size:24px;line-height:1.1}
.chip span{font-size:12px;color:var(--suave)}
.chip.rojo{background:var(--rojo-claro)} .chip.rojo b{color:var(--rojo)}
.chip.ocre{background:var(--ocre-claro)} .chip.ocre b{color:var(--ocre)}
.chip.verde{background:var(--verde-claro)} .chip.verde b{color:var(--verde)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:18px 0 8px}
.card{background:var(--tarjeta);border:2px solid var(--borde);border-left-width:8px;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card.rojo{border-left-color:var(--rojo)} .card.ocre{border-left-color:var(--ocre)} .card.verde{border-left-color:var(--verde)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .t strong{font-size:17px}
.card .f{font-weight:700;white-space:nowrap}
.card.rojo .f{color:var(--rojo)} .card.ocre .f{color:var(--ocre)}
.card .s{color:var(--suave);font-size:14px;margin-top:2px}
.etq{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:6px;margin-right:4px;
  background:var(--gris-claro)}
.etq.rojo{background:var(--rojo-claro);color:var(--rojo)} .etq.ocre{background:var(--ocre-claro);color:var(--ocre)}
.etq.verde{background:var(--verde-claro);color:var(--verde)}
.vacio{text-align:center;color:var(--suave);padding:32px 0}
.gen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gen span{background:var(--verde-claro);color:var(--verde);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.gen span b{font-size:15px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cats span{background:var(--gris-claro);border-radius:8px;padding:2px 8px;font-size:13px}
.nota{font-size:12px;color:var(--suave);margin:4px 0 0}
.tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tabla td{padding:3px 4px;border-top:1px solid var(--borde)} .tabla td:last-child{text-align:right;font-weight:600}
details>summary{cursor:pointer;color:var(--suave);font-size:13px;margin-top:6px;min-height:28px}
#buscar{width:100%;padding:10px 12px;border:2px solid var(--borde);border-radius:10px;background:var(--tarjeta);margin:4px 0 8px;min-height:44px}
.tot{background:var(--tarjeta);border:2px solid var(--borde);border-radius:12px;padding:10px 12px;margin:12px 0}
.tot .grande{display:flex;gap:16px}.tot .grande div{flex:1}
.tot .grande b{display:block;font-size:30px;line-height:1.1}.tot .grande span{font-size:12px;color:var(--suave)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="fila">
    <h1>🩺 Sanidad</h1>
    <div class="fila">
      <select id="estab" aria-label="Establecimiento">
        <option value="la_vuelta">La Vuelta</option>
        <option value="maria_laura">María Laura</option>
        <option value="pone_chico">Pone Chico</option>
      </select>
      <button id="refrescar" aria-label="Actualizar ahora">⟳</button>
    </div>
  </div>
  <p id="estado">Cargando…</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-prox" aria-selected="true">Próximos</button>
    <button class="tab" role="tab" id="tab-ult" aria-selected="false">Últimos</button>
    <button class="tab" role="tab" id="tab-stock" aria-selected="false">Stock</button>
  </div>
</header>
<main>
  <div id="clave-aviso" hidden>
    <p id="clave-msg"></p>
    <div class="fila">
      <input id="clave-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Clave del campo" aria-label="Clave del campo">
      <button id="clave-guardar">Guardar</button>
    </div>
    <p id="clave-error" hidden></p>
  </div>
  <section id="vista-prox"></section>
  <section id="vista-ult" hidden></section>
  <section id="vista-stock" hidden></section>
</main>

<script>
const SUPABASE_URL = 'https://skkknfjpwcstefcroqjt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_U62qYc-mqby-ZGzE9FG2IA_kzOTGGJK';
const REFRESCO_MS = 5 * 60 * 1000;      // cada cuánto se vuelve a leer
const PUBLICACION_VIEJA_H = 6;           // si la PC no publicó hace más que esto, se avisa
const CLAVE_LS = 'tablero_sanidad_v1';
/* Clave del campo (Fase 4). Pone Chico no usa clave (21/10/2026). */
const CON_CLAVE = { la_vuelta: true, maria_laura: true, pone_chico: false };
const NOMBRE_CAMPO = { la_vuelta: 'La Vuelta', maria_laura: 'María Laura', pone_chico: 'Pone Chico' };
const CLAVE_RE = /^[a-z0-9]{8,64}$/;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- fechas (día calendario de Uruguay, sin corrimientos de zona) ---------- */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function diaNum(iso){            // 'YYYY-MM-DD' -> nº de día absoluto (para restar sin zona horaria)
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) / 86400000 : null;
}
function diasHasta(iso){ const a = diaNum(iso), b = diaNum(hoyISO()); return a == null ? null : a - b; }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? (+m[3]) + ' ' + MESES[+m[2]-1] + (m[1] !== hoyISO().slice(0,4) ? ' ' + m[1] : '') : '—';
}
function relativo(n){
  if(n == null) return '';
  if(n === 0) return 'hoy';
  if(n === 1) return 'mañana';
  if(n === -1) return 'ayer';
  return n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días';
}

/* ---------- clave del campo ---------- */
function claveDe(estab){
  if(!CON_CLAVE[estab]) return '';
  try{
    const c = String(localStorage.getItem('clave_campo_' + estab) || '').trim().toLowerCase();
    return CLAVE_RE.test(c) ? c : '';
  }catch(e){ return ''; }
}
function cab(estab){
  const h = { apikey: SUPABASE_ANON_KEY };
  const c = claveDe(estab);
  if(c) h['x-clave-campo'] = c;
  return h;
}
const claveMala = {};          // campo -> true si el servidor dijo que la clave guardada no sirve
const claveVerificada = {};    // campo + clave -> ya hubo una respuesta definitiva
/* 'ok' | 'mala' | 'sin_respuesta': un error de red o de la función NUNCA cuenta como clave mala. */
async function verificarClave(estab, clave){
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/verificar_clave', { method: 'POST', cache: 'no-store',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ est: estab, clave }) });
    if(!r.ok) return 'sin_respuesta';
    const v = await r.json();
    return v === true ? 'ok' : v === false ? 'mala' : 'sin_respuesta';
  }catch(e){ return 'sin_respuesta'; }
}
async function verificarGuardada(estab){
  const c = claveDe(estab);
  if(!c || claveVerificada[estab + c]) return;
  const r = await verificarClave(estab, c);
  if(r === 'sin_respuesta') return;
  claveVerificada[estab + c] = true;
  claveMala[estab] = (r === 'mala');
}
function pintarAvisoClave(){
  const estab = $('estab').value;
  let msg = '';
  if(CON_CLAVE[estab]){
    if(!claveDe(estab)) msg = '🔑 Falta la clave de ' + NOMBRE_CAMPO[estab] + '. Escribila una vez para seguir viendo los datos.';
    else if(claveMala[estab]) msg = '🔑 La clave guardada de ' + NOMBRE_CAMPO[estab] + ' ya no sirve. Escribí la nueva.';
  }
  $('clave-msg').textContent = msg;
  $('clave-aviso').hidden = !msg;
}
function errorClave(txt){ const e = $('clave-error'); e.textContent = txt || ''; e.hidden = !txt; }
async function guardarClave(){
  const estab = $('estab').value;
  const c = String($('clave-input').value || '').trim().toLowerCase();
  errorClave('');
  if(!CON_CLAVE[estab]) return;
  if(!CLAVE_RE.test(c)){ errorClave('La clave tiene solo letras (sin tildes ni ñ) y números, sin espacios, y al menos 8 caracteres.'); return; }
  $('clave-guardar').disabled = true;
  try{
    const r = await verificarClave(estab, c);
    if(r === 'sin_respuesta'){ errorClave('No se pudo comprobar la clave ahora (sin conexión). Probá de nuevo cuando tengas señal.'); return; }
    if(r === 'mala'){ errorClave('Esa no es la clave de ' + NOMBRE_CAMPO[estab] + '. Revisala y probá de nuevo.'); return; }
    try{ localStorage.setItem('clave_campo_' + estab, c); }
    catch(e){ errorClave('No se pudo guardar la clave en este equipo (memoria llena o navegador bloqueado).'); return; }
    claveMala[estab] = false; claveVerificada[estab + c] = true;
    $('clave-input').value = '';
    pintarAvisoClave();
    actualizar();
  }finally{ $('clave-guardar').disabled = false; }
}

/* ---------- lectura ---------- */
async function pedir(tabla, estab, orden){
  const url = SUPABASE_URL + '/rest/v1/' + tabla + '?select=*&establecimiento=eq.' + encodeURIComponent(estab) +
              '&order=' + orden + '&limit=500';
  const r = await fetch(url, { headers: cab(estab), cache: 'no-store' });
  if(!r.ok) throw new Error(tabla + ': HTTP ' + r.status);
  const filas = await r.json();
  if(!Array.isArray(filas)) throw new Error(tabla + ': respuesta inesperada');
  return filas;
}
/* PostgREST corta en 1000 filas sin avisar: se pide de a lotes con offset. */
async function pedirTodo(tabla, estab, select, orden, extra, claveEstab){
  const filas = [];
  for(let desde = 0; desde < 20000; desde += 1000){
    const url = SUPABASE_URL + '/rest/v1/' + tabla + '?select=' + select + (estab ? '&establecimiento=eq.' + encodeURIComponent(estab) : '') +
                (extra || '') + '&order=' + orden + '&limit=1000&offset=' + desde;
    const r = await fetch(url, { headers: cab(claveEstab || estab), cache: 'no-store' });
    if(!r.ok) throw new Error(tabla + ': HTTP ' + r.status);
    const lote = await r.json();
    if(!Array.isArray(lote)) throw new Error(tabla + ': respuesta inesperada');
    filas.push(...lote);
    if(lote.length < 1000) break;
  }
  return filas;
}
let datos = { prox: [], ult: [], stock: [], gens: null, leido: null };
function leerCache(estab){
  try{ const c = JSON.parse(localStorage.getItem(CLAVE_LS + '_' + estab)); if(c && Array.isArray(c.prox) && Array.isArray(c.ult)){ c.stock = c.stock || []; c.gens = c.gens || null; return c; } }catch(e){}
  return null;
}
function guardarCache(estab){ try{ localStorage.setItem(CLAVE_LS + '_' + estab, JSON.stringify(datos)); }catch(e){} }

/* ---------- pintado ---------- */
/* Generación de un tratamiento. La PC no publica `gen` en sanidad_proximos/sanidad_ultimos: para Últimos se busca
   la carga (sanidad_carga*) con la misma fecha, categoría, potrero y cantidad; si alguna vez la tabla trae `gen`, se usa directo. */
const TABLA_CARGA = { la_vuelta: { t: 'sanidad_carga', conEstab: true }, maria_laura: { t: 'sanidad_carga_maria_laura', conEstab: false },
                      pone_chico: { t: 'sanidad_carga_pone_chico', conEstab: false } };
const normTxt = x => String(x == null ? '' : x).trim().toLowerCase();
const claveCarga = (f, c, p, n) => String(f || '').slice(0, 10) + '|' + normTxt(c) + '|' + normTxt(p) + '|' + (Number(n) || 0);
function etiquetaGen(g){
  const t = String(g == null ? '' : g).trim();
  if(!t) return '';
  return /^\d$/.test(t) ? anioGen(t) + ' (gen ' + t + ')' : 'gen ' + t;
}
function etqsGen(lista){
  const v = [...new Set((lista || []).map(etiquetaGen).filter(Boolean))];
  return v.length ? '<span class="etq verde">Generación ' + v.map(esc).join(' · ') + '</span>' : '';
}
function genDe(f){ return f.gen != null && f.gen !== '' ? [f.gen] : (f._gen || []); }
/* agrega f._gen a cada fila de Últimos con las cargas que coinciden */
function cruzarGen(ult, cargas){
  const m = {};
  for(const c of cargas){
    if(c.gen == null || c.gen === '') continue;
    const k = claveCarga(c.fecha, c.categoria, c.potrero, c.cantidad);
    (m[k] = m[k] || []).push(c.gen);
  }
  for(const f of ult){ const g = m[claveCarga(f.fecha, f.categoria, f.potrero, f.cantidad)]; if(g) f._gen = [...new Set(g)]; }
}
/* Categoría "base" para poder comparar las del tratamiento ("Novillos", "Vacas") con las de la caravana ("Novillo 2-3", "Vaca"):
   sin tildes ni mayúsculas, sin edades ("2-3", "1-2") y en singular. */
function catBase(c){
  let t = String(c == null ? '' : c).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  t = t.replace(/\b\d+\s*-\s*\d+\b/g, ' ').replace(/\b\d+\b/g, ' ').replace(/\s+/g, ' ').trim();
  return t.split(' ').map(w => w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w).join(' ');
}
/* generaciones de los animales con caravana (activos) de una categoría: [[año(dígito), cantidad], ...] */
function gensDeCategoria(cat){
  if(!datos.gens) return [];
  const base = catBase(cat), m = {};
  if(!base) return [];
  for(const g of datos.gens){
    if(catBase(g.categoria) !== base) continue;
    const y = anioGen(g.gen);
    m[y] = (m[y] || 0) + g.n;
  }
  return Object.entries(m).sort((a, b) => (a[0] === 's/d') - (b[0] === 's/d') || b[0].localeCompare(a[0]));
}
function etqCaravana(cat){
  const l = gensDeCategoria(cat);
  if(!l.length) return '';
  return '<div class="s" style="margin-top:6px">Generaciones con caravana</div><div class="gen">' + l.map(([y, n]) =>
    '<span>' + esc(/^\d{4}$/.test(y) ? y + ' (gen ' + y.slice(-1) + ')' : y) + ' · <b>' + esc(n) + '</b></span>').join('') + '</div>';
}
function nivelProximo(f){
  const n = f.fecha_prevista ? diasHasta(f.fecha_prevista) : (f.dias == null ? null : Number(f.dias));
  if(n == null || isNaN(n)) return { n: null, nivel: 'verde' };
  return { n, nivel: n < 0 ? 'rojo' : n <= 15 ? 'ocre' : 'verde' };
}
function pintarProximos(){
  const filas = datos.prox.map(f => ({ f, ...nivelProximo(f) }));
  filas.sort((a, b) => (a.n == null) - (b.n == null) || a.n - b.n);
  const cuenta = nv => filas.filter(x => x.nivel === nv).length;
  let h = '<div class="resumen">' +
    '<div class="chip rojo"><b>' + cuenta('rojo') + '</b><span>vencidos</span></div>' +
    '<div class="chip ocre"><b>' + cuenta('ocre') + '</b><span>en 15 días</span></div>' +
    '<div class="chip verde"><b>' + cuenta('verde') + '</b><span>más adelante</span></div></div>';
  if(!filas.length) h += '<p class="vacio">No hay tratamientos próximos cargados.</p>';
  const grupos = [['rojo','Vencidos'],['ocre','Próximos 15 días'],['verde','Más adelante']];
  for(const [nv, titulo] of grupos){
    const g = filas.filter(x => x.nivel === nv);
    if(!g.length) continue;
    h += '<h2>' + titulo + '</h2>';
    for(const x of g){
      const f = x.f;
      h += '<div class="card ' + nv + '"><div class="t"><strong>' + esc(f.categoria || '—') + ' · ' + esc(f.sanidad || '') +
        '</strong><span class="f">' + esc(fechaCorta(f.fecha_prevista)) + '</span></div>' +
        '<div class="s">' + (x.n != null ? esc(relativo(x.n)) : '') +
        (f.animales != null ? ' · ' + esc(f.animales) + ' animales' : '') + '</div>' +
        '<div class="s">Último: ' + esc(f.ultimo_producto || '—') + (f.ultimo_tratamiento ? ' (' + esc(fechaCorta(f.ultimo_tratamiento)) + ')' : '') + '</div>' +
        (f.estado ? '<span class="etq ' + nv + '">' + esc(f.estado) + '</span>' : '') + etqsGen(genDe(f)) + etqCaravana(f.categoria) + '</div>';
    }
  }
  $('vista-prox').innerHTML = h;
}
function pintarUltimos(){
  const filas = datos.ult.slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  const en30 = filas.filter(f => { const n = diasHasta(f.fecha); return n != null && n >= -30; }).length;
  const enRetiro = filas.filter(f => { const n = f.apto_desde ? diasHasta(f.apto_desde) : null; return n != null && n > 0; }).length;
  let h = '<div class="resumen">' +
    '<div class="chip verde"><b>' + en30 + '</b><span>últimos 30 días</span></div>' +
    '<div class="chip ocre"><b>' + enRetiro + '</b><span>en retiro</span></div></div>';
  if(!filas.length) h += '<p class="vacio">No hay tratamientos cargados.</p>';
  for(const f of filas){
    const ra = f.apto_desde ? diasHasta(f.apto_desde) : null;
    const nivel = ra != null && ra > 0 ? 'ocre' : 'verde';
    h += '<div class="card ' + nivel + '"><div class="t"><strong>' + esc(f.categoria || '—') +
      (f.cantidad != null ? ' · ' + esc(f.cantidad) : '') + '</strong><span class="f">' + esc(fechaCorta(f.fecha)) + '</span></div>' +
      '<div class="s">' + esc(f.productos || '—') + (f.dosis ? ' · ' + esc(f.dosis) : '') + '</div>' +
      '<div class="s">' + (f.potrero ? 'Potrero ' + esc(f.potrero) : '') + (f.dias_hace != null ? (f.potrero ? ' · ' : '') + esc(relativo(-Number(f.dias_hace))) : '') + '</div>' +
      (ra != null ? '<span class="etq ' + (ra > 0 ? 'ocre' : 'verde') + '">' + (ra > 0 ? 'En retiro hasta ' + esc(fechaCorta(f.apto_desde)) : 'Apto desde ' + esc(fechaCorta(f.apto_desde))) + '</span>' : '') +
      (f.costo_animal != null && f.costo_animal !== '' ? '<span class="etq">US$ ' + esc(Number(f.costo_animal).toFixed(2)) + ' / animal</span>' : '') +
      etqsGen(genDe(f)) +
      (f.observaciones ? '<div class="s">' + esc(f.observaciones) + '</div>' : '') + '</div>';
  }
  $('vista-ult').innerHTML = h;
}

/* ---------- stock por potrero + generación ---------- */
const normPot = x => String(x == null ? '' : x).trim().toUpperCase();
/* GEN en el padrón es el ÚLTIMO DÍGITO del año de nacimiento (5 = 2025): se toma el año más reciente que no sea futuro. */
function anioGen(g){
  const t = String(g == null ? '' : g).trim();
  if(/^\d{4}$/.test(t)) return t;
  if(!/^\d$/.test(t)) return 's/d';
  let y = +hoyISO().slice(0, 4);
  while(y % 10 !== +t) y--;
  return String(y);
}
function nat(a, b){ return String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' }); }
function fmtN(n){ return Number(n).toLocaleString('es-UY', { maximumFractionDigits: 1 }); }
function chipsGen(m){
  const ks = Object.keys(m).sort((a, b) => (a === 's/d') - (b === 's/d') || b.localeCompare(a));
  return ks.length ? '<div class="gen">' + ks.map(k => '<span>' + esc(/^\d{4}$/.test(k) ? k + ' (gen ' + k.slice(-1) + ')' : k) + ' · <b>' + esc(m[k]) + '</b></span>').join('') + '</div>' : '';
}
function pintarStock(){
  const filtro = normPot(($('buscar') || {}).value);
  const stock = datos.stock;
  if(!stock.length){ $('vista-stock').innerHTML = '<p class="vacio">No hay stock publicado para este establecimiento.</p>'; return; }
  const pots = {};
  let animales = 0, ug = 0;
  const porEspecie = {}, porCat = {};
  for(const f of stock){
    const n = Number(f.cantidad) || 0;
    if(!n) continue;
    const p = pots[f.potrero] = pots[f.potrero] || { nombre: f.potrero, n: 0, ug: 0, cats: {}, filas: [] };
    p.n += n; p.ug += Number(f.ug) || 0; p.cats[f.categoria] = (p.cats[f.categoria] || 0) + n; p.filas.push(f);
    animales += n; ug += Number(f.ug) || 0;
    const e = f.especie || 'Otros'; porEspecie[e] = (porEspecie[e] || 0) + n;
    porCat[f.categoria] = (porCat[f.categoria] || 0) + n;
  }
  /* generación (solo animales con caravana, activos): total y por potrero */
  const gens = datos.gens;
  const genTotal = {}, genPot = {};
  let conCaravana = 0;
  if(gens){
    for(const g of gens){
      const y = anioGen(g.gen), k = normPot(g.potrero);
      genTotal[y] = (genTotal[y] || 0) + g.n; conCaravana += g.n;
      if(k){ genPot[k] = genPot[k] || {}; genPot[k][y] = (genPot[k][y] || 0) + g.n; }
    }
  }
  const nPots = Object.keys(pots).length;
  const pub = stock.map(f => f.actualizado_en).filter(Boolean).sort().pop();
  let h = '<div class="tot"><div class="grande"><div><b>' + fmtN(animales) + '</b><span>animales</span></div>' +
    '<div><b>' + fmtN(ug) + '</b><span>UG</span></div><div><b>' + nPots + '</b><span>potreros con hacienda</span></div></div>';
  h += '<div class="cats">' + Object.entries(porEspecie).sort((a, b) => b[1] - a[1]).map(([k, v]) => '<span>' + esc(k) + ' <b>' + fmtN(v) + '</b></span>').join('') + '</div>';
  h += '<details><summary>Por categoría</summary><table class="tabla">' +
    Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + fmtN(v) + '</td></tr>').join('') + '</table></details>';
  if(gens){
    h += '<h2 style="margin-top:12px">Generación (año de nacimiento)</h2>' + chipsGen(genTotal) +
      '<p class="nota">Cuenta solo los animales con caravana activos (' + fmtN(conCaravana) + ' de ' + fmtN(animales) + '). El resto del stock no tiene generación registrada.</p>';
  }else{
    h += '<p class="nota">No se pudo leer la generación (padrón de caravanas) por ahora.</p>';
  }
  if(pub) h += '<p class="nota">Stock publicado por las apps: ' + esc(fechaCorta(pub.slice(0, 10))) + ' ' + esc(horaLocal(new Date(pub))) + '</p>';
  h += '</div><input id="buscar" type="search" placeholder="Buscar potrero…" value="' + esc(($('buscar') || {}).value || '') + '" aria-label="Buscar potrero">';
  const lista = Object.values(pots).filter(p => !filtro || normPot(p.nombre).includes(filtro)).sort((a, b) => nat(a.nombre, b.nombre));
  for(const p of lista){
    h += '<div class="card verde"><div class="t"><strong>Potrero ' + esc(p.nombre) + '</strong><span class="f">' + fmtN(p.n) + '</span></div>' +
      '<div class="s">' + fmtN(p.ug) + ' UG</div>' +
      '<div class="cats">' + Object.entries(p.cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => '<span>' + esc(k) + ' <b>' + fmtN(v) + '</b></span>').join('') + '</div>';
    const g = genPot[normPot(p.nombre)];
    if(g) h += '<div class="s" style="margin-top:6px">Generación (con caravana)</div>' + chipsGen(g);
    h += '<details><summary>Por dueño / firma</summary><table class="tabla">' +
      p.filas.slice().sort((a, b) => nat(a.categoria, b.categoria) || nat(a.dueno, b.dueno)).map(f =>
        '<tr><td>' + esc(f.categoria) + ' · ' + esc(f.dueno || 'sin asignar') + '</td><td>' + fmtN(f.cantidad) + '</td></tr>').join('') + '</table></details></div>';
  }
  if(!lista.length) h += '<p class="vacio">Ningún potrero coincide.</p>';
  /* sin potrero en el padrón o con un nombre que no figura en el stock */
  if(gens){
    const sueltas = {};
    for(const g of gens){ const k = normPot(g.potrero); if(!k || !Object.keys(pots).some(n => normPot(n) === k)){ const y = anioGen(g.gen); sueltas[y] = (sueltas[y] || 0) + g.n; } }
    if(Object.keys(sueltas).length && !filtro) h += '<h2>Con caravana, sin potrero del stock</h2><div class="card"><div class="s">Animales cuyo potrero del bastón no coincide con ninguno del stock</div>' + chipsGen(sueltas) + '</div>';
  }
  const foco = document.activeElement && document.activeElement.id === 'buscar';
  $('vista-stock').innerHTML = h;
  const b = $('buscar');
  b.oninput = () => pintarStock();
  if(foco){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
}
function pintarEstado(msg, mal){
  const el = $('estado'); el.textContent = msg; el.className = mal ? 'mal' : '';
}
function horaLocal(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function textoEstado(extra){
  let t = datos.leido ? 'Leído ' + (diaNum(datos.leido.slice(0,10)) === diaNum(hoyISO()) ? 'hoy ' : fechaCorta(datos.leido) + ' ') + horaLocal(new Date(datos.leido)) : '';
  const pub = [...datos.prox, ...datos.ult].map(f => f.actualizado).filter(Boolean).sort().pop();
  if(pub){
    const hs = (Date.now() - new Date(pub).getTime()) / 3600000;
    if(hs > PUBLICACION_VIEJA_H) return { texto: t + ' · ⚠ la PC no publica desde hace ' + (hs >= 48 ? Math.round(hs/24) + ' días' : Math.round(hs) + ' h'), mal: true };
  }
  return { texto: t + (extra || ''), mal: false };
}
function pintarTodo(extra){
  pintarProximos(); pintarUltimos(); pintarStock();
  const e = textoEstado(extra); pintarEstado(e.texto || 'Sin datos', e.mal);
}

/* ---------- ciclo ---------- */
function resumirGens(filas){      // solo animales activos; se guarda agrupado para que la copia sea chica
  const m = {};
  for(const a of filas){
    if(a.estado_vida && a.estado_vida !== 'ACTIVO') continue;
    const k = normPot(a.potrero) + '|' + String(a.gen == null ? '' : a.gen).trim() + '|' + normTxt(a.categoria);
    m[k] = m[k] || { potrero: String(a.potrero == null ? '' : a.potrero).trim(), gen: a.gen, categoria: a.categoria || '', n: 0 };
    m[k].n++;
  }
  return Object.values(m);
}
let enCurso = false;
async function actualizar(){
  if(enCurso) return;
  enCurso = true;
  const estab = $('estab').value;
  try{
    await verificarGuardada(estab);
    if($('estab').value !== estab) return;
    const tc = TABLA_CARGA[estab];
    const [prox, ult, stock, gens, cargas] = await Promise.all([
      pedir('sanidad_proximos', estab, 'fecha_prevista.asc.nullslast'), pedir('sanidad_ultimos', estab, 'fecha.desc'),
      pedirTodo('stock_potreros', estab, 'potrero,categoria,dueno,cantidad,ug,especie,actualizado_en', 'potrero.asc,clave.asc'),
      /* la generación es un extra: si el padrón no se puede leer, el resto del tablero sigue andando */
      pedirTodo('animales_caravana', estab, 'potrero,gen,categoria,estado_vida', 'id8.asc').then(resumirGens).catch(() => null),
      /* también un extra: si la carga no se puede leer, Últimos sale igual, sin generación */
      tc ? pedirTodo(tc.t, tc.conEstab ? estab : null, 'fecha,categoria,potrero,cantidad,gen', 'fecha.desc,id.asc', '&gen=not.is.null', estab).catch(() => []) : []
    ]);
    if($('estab').value !== estab) return;       // cambió de establecimiento mientras leía
    /* Sin clave válida las políticas contestan 200 sin filas: no se pisa la última copia con una lectura vacía. */
    if(CON_CLAVE[estab] && (!claveDe(estab) || claveMala[estab]) && !prox.length && !ult.length && !stock.length){
      pintarAvisoClave();
      pintarTodo(' · sin clave, mostrando la última copia');
      return;
    }
    cruzarGen(ult, cargas);
    datos = { prox, ult, stock, gens, leido: new Date().toISOString() };
    guardarCache(estab);
    pintarAvisoClave();
    pintarTodo();
  }catch(e){
    if($('estab').value === estab) pintarTodo(' · sin conexión, mostrando la última copia');
  }finally{ enCurso = false; }
}
function cambiarEstab(){
  try{ localStorage.setItem(CLAVE_LS + '_estab', $('estab').value); }catch(e){}
  datos = leerCache($('estab').value) || { prox: [], ult: [], stock: [], gens: null, leido: null };
  pintarAvisoClave(); pintarTodo(); actualizar();
}
function elegirTab(cual){
  for(const t of ['prox', 'ult', 'stock']){
    $('vista-' + t).hidden = t !== cual;
    $('tab-' + t).setAttribute('aria-selected', String(t === cual));
  }
  try{ localStorage.setItem(CLAVE_LS + '_tab', cual); }catch(e){}
}
$('tab-prox').onclick = () => elegirTab('prox');
$('tab-ult').onclick = () => elegirTab('ult');
$('tab-stock').onclick = () => elegirTab('stock');
$('estab').onchange = cambiarEstab;
$('refrescar').onclick = actualizar;
$('clave-guardar').onclick = guardarClave;
$('clave-input').addEventListener('keydown', e => { if(e.key === 'Enter') guardarClave(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) actualizar(); });
setInterval(() => { if(!document.hidden) actualizar(); }, REFRESCO_MS);
try{ const g = localStorage.getItem(CLAVE_LS + '_estab'); if(g && [...$('estab').options].some(o => o.value === g)) $('estab').value = g; }catch(e){}
try{ const t = localStorage.getItem(CLAVE_LS + '_tab'); if(['prox', 'ult', 'stock'].includes(t)) elegirTab(t); }catch(e){}
cambiarEstab();
</script>
