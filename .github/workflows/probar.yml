name: Probar apps de potreros

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura por defecto; el job que publica pide sus propios permisos.
permissions:
  contents: read

# Hora de Uruguay. El runner usa UTC, y un error de zona horaria en las fechas del dia
# (los formularios proponian la fecha de manana desde las 21:00) no se veia en CI (9/10/2026).
env:
  TZ: America/Montevideo

jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Todo tests/probar_*.js esta en este workflow (una prueba fuera de la lista nunca corre)
        run: |
          faltan=0
          for f in tests/probar_*.js; do
            b=$(basename "$f")
            if ! grep -q "tests/$b" .github/workflows/probar.yml; then
              echo "FALTA en .github/workflows/probar.yml: $b"
              faltan=1
            fi
          done
          exit $faltan

      - name: Template -- los 9 index.html coinciden con lo que generaría el template
        run: node template/generar.js --check

      - name: Instalar jsdom
        working-directory: tests
        run: npm install

      - name: Banco general (La Vuelta y María Laura)
        run: node tests/probar_app.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: "+ Cargar tratamiento (Sanidad)"
        run: node tests/probar_sanidad_carga.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Saldo negativo al mover
        run: node tests/probar_saldo_negativo.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: Lluvias
        run: node tests/probar_lluvias.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: Agregar animales — solo carga inicial
        run: node tests/probar_agregar_solo_inicial.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: Pone Chico (arranque sin potreros)
        run: node tests/probar_pone_chico.js pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Agregar animales en Pone Chico
        run: node tests/probar_agregar_pone_chico.js pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Eliminar potrero (La Vuelta y Pone Chico)
        run: node tests/probar_eliminar_potrero.js la-vuelta-movil/index.html pone-chico-movil/index.html

      - name: Stock total (PC y móvil, las 3 apps)
        run: node tests/probar_stock_total.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Borrar historial revierte bien el stock (mover uno / TODO / recategorizar)
        run: node tests/probar_borrar_historial.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: Sincronizar no duplica eventos si se llama dos veces en simultaneo
        run: node tests/probar_sync_concurrente.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Voz -- resuelve potrero con relleno (en el N / al potrero N) y no confunde categoria/cantidad
        run: node tests/probar_voz.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Auditoria 8/9 -- cola no pierde eventos, voz se puede borrar, exportadores muestran negativos, restablecer avisa
        run: node tests/probar_auditoria_fixes.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Borrar una carga de nacimiento/muerte descuenta del total de la temporada
        run: node tests/probar_temporada_correccion.js la-vuelta-pc/index.html la-vuelta-movil/index.html

      - name: Una correccion sincronizada tacha el movimiento original (no deja una linea suelta)
        run: node tests/probar_correccion_marca_original.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Maria Laura -- "Cerro" renombrado a "Rincon" (migra datos guardados y traduce eventos viejos)
        run: node tests/probar_renombrar_cerro_rincon.js maria-laura-pc/index.html maria-laura-movil/index.html

      - name: Desaparecido -- resta, caso abierto parcial/total, Encontrado a otro potrero, Perdida, sincronizado, borrar revierte
        run: node tests/probar_desaparecidos.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: Firma en La Vuelta -- migracion de claves sin firma, formularios opcionales, Dueno sigue obligatorio en Maria Laura/Pone Chico
        run: node tests/probar_firma_la_vuelta.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Auditoria 12/9 (P0): event_id evita duplicar un reintento, Restablecer borra tambien el ID de dispositivo"
        run: node tests/probar_idempotencia_reset.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Stock por potrero publicado en Supabase (stock_potreros) -- rollout gradual por CONFIG.stockSupabase"
        run: node tests/probar_stock_potreros.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Asignar dueño destino en Mover una categoria (sin cambiar de potrero ni categoria)"
        run: node tests/probar_asignar_dueno.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Boton X de cada modal cierra igual que Cerrar/Cancelar -- excepto Quien soy, donde cierra como Guardar"
        run: node tests/probar_cerrar_modales.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Fase 7 -- importador de aguadas/instalaciones por KML/KMZ/GPX, sincronizado (punto_creado/punto_eliminado)"
        run: node tests/probar_importar_puntos.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Sanidad sin Excel -- No apto (T espera, todos los productos) y Proximo tratamiento (T_Residual, solo garrapaticidas)"
        run: node tests/probar_sanidad_calculos.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Abortos en Herramientas -- registro sin potrero, sincronizado, y % junto al de nacidos"
        run: node tests/probar_abortos.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Señalada en Herramientas -- registro sin potrero, macho/hembra, sincronizado, y % sobre ovejas encarneradas"
        run: node tests/probar_senalada.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Dibujar potrero a mano (solo PC) -- vertices, deshacer, terminar, Eliminar potrero, sincronizado"
        run: node tests/probar_dibujar_potrero.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html la-vuelta-movil/index.html maria-laura-movil/index.html pone-chico-movil/index.html

      - name: "DICOSE Fase A (solo La Vuelta) -- guia en Compra/Venta, agregar guia despues, campo ajeno"
        run: node tests/probar_dicose.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html

      - name: "Traslado La Vuelta -> Maria Laura (dos establecimientos contra el mismo servidor) -- salida con guia, entrada automatica, anular, cola offline"
        run: node tests/probar_traslado.js la-vuelta-pc/index.html maria-laura-pc/index.html la-vuelta-movil/index.html maria-laura-movil/index.html la-vuelta-movil-campo/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "Movimientos DICOSE (8/10/2026) -- lista de todo lo que tiene guia + venta entre duenos solo con guia, anular, sincronizado"
        run: node tests/probar_movimientos_dicose.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html la-vuelta-movil-campo/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "Compras y ventas completas (9/10/2026) -- formulario de la PC con kilos/precio/comision/descuentos, catalogos, Pieza/VCUT, completar datos desde la PC"
        run: node tests/probar_finanzas_compraventa.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: "Movil simple / \"*-campo\" (para un empleado, 3 establecimientos) -- que se mantiene/excluye, y sincroniza sin casos especiales con su movil completo"
        run: node tests/probar_la_vuelta_simple.js la-vuelta-movil-campo/index.html la-vuelta-movil/index.html maria-laura-movil-campo/index.html maria-laura-movil/index.html pone-chico-movil-campo/index.html pone-chico-movil/index.html

      - name: "Buscar caravana (solo La Vuelta) -- padron animales_caravana, estados de carencia, caravana en el tratamiento"
        run: node tests/probar_caravana.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-movil/index.html pone-chico-movil/index.html

      - name: "Pesadas (solo La Vuelta) -- historial en la ficha, resumen por lote de la sesion del baston, proporcion contra el stock"
        run: node tests/probar_pesadas.js la-vuelta-pc/index.html la-vuelta-movil/index.html la-vuelta-movil-campo/index.html maria-laura-movil/index.html pone-chico-movil/index.html

      - name: "Reportes de campo (Infraestructura / Capin Annoni) -- GPS de un toque, tocar el mapa, marcar resuelto, sincronizado"
        run: node tests/probar_infraestructura.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "PC: editar y borrar cualquier evento (3/10/2026) -- historial incluso de otros dispositivos, abortos y eventos climaticos, sincronizado"
        run: node tests/probar_editar_borrar_pc.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html

      - name: "PC: caja de Herramientas ordenada por funciones (10/10/2026) -- 4 grupos, 5 sub-menus, sin Exportar MD; movil y Campo sin cambios"
        run: node tests/probar_herramientas_pc.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html

      - name: "Muertes de terneros en dos grupos, de temporada y marcados (10/10/2026) -- formulario, Stock total, editar/borrar y voz"
        run: node tests/probar_muerte_terneros_grupo.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html

      - name: "Movil completa y Campo comparten almacenamiento (6/10/2026) -- una pagina abierta se actualiza sola cuando la otra guarda"
        run: node tests/probar_actualizar_solo.js la-vuelta-pc/index.html la-vuelta-movil/index.html la-vuelta-movil-campo/index.html maria-laura-pc/index.html maria-laura-movil/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "Evento hacia un potrero todavia desconocido (7/10/2026) -- se estaciona y se aplica cuando el potrero aparece; el pasado no cambia"
        run: node tests/probar_evento_potrero_desconocido.js la-vuelta-pc/index.html la-vuelta-movil/index.html la-vuelta-movil-campo/index.html maria-laura-pc/index.html maria-laura-movil/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "Sanidad: editar y borrar un tratamiento (7/10/2026) -- solo PC, nada que el Excel ya importo, avisa si RLS bloquea"
        run: node tests/probar_sanidad_editar_borrar.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html

      - name: "Seguridad (auditoria 30/9/2026) -- HTML y datos invalidos que llegan por eventos_sync no inyectan nada ni rompen el render"
        run: node tests/probar_seguridad_remoto.js la-vuelta-pc/index.html la-vuelta-movil/index.html la-vuelta-movil-campo/index.html maria-laura-pc/index.html maria-laura-movil/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "la-vuelta-test aislada (auditoria 1/10/2026) -- la copia de prueba nunca habla con Supabase"
        run: node tests/probar_test_aislado.js la-vuelta-test/index.html
      - name: "Service workers: precarga robusta, apertura offline y caches propias (auditoria Campo 8/10/2026)"
        run: node tests/probar_sw_offline.js
      - name: "Actualizacion de la app no recarga con un formulario abierto (8/10/2026)"
        run: node tests/probar_recarga_segura.js la-vuelta-pc/index.html la-vuelta-movil/index.html la-vuelta-movil-campo/index.html maria-laura-pc/index.html maria-laura-movil/index.html maria-laura-movil-campo/index.html pone-chico-pc/index.html pone-chico-movil/index.html pone-chico-movil-campo/index.html

      - name: "Dias de ocupacion -- un evento atrasado usa la fecha real del movimiento, no hoy (14/9/2026, estaba fuera de la lista)"
        run: node tests/probar_ocupacion.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html

      - name: "Fase 1 de la auditoria (9/10/2026) -- textos escapados, aviso si no se puede guardar, importar backup validado, filtro de borrado de stock"
        run: node tests/probar_fase1_arreglos.js la-vuelta-pc/index.html la-vuelta-movil/index.html maria-laura-pc/index.html maria-laura-movil/index.html pone-chico-pc/index.html pone-chico-movil/index.html

      - name: "Fase 5 de la auditoria (10/10/2026) -- el boton PDF: Animales por potrero (nacimientos por especie) se guarda con y sin conexion"
        run: node tests/probar_pdf_animales.js la-vuelta-pc/index.html maria-laura-pc/index.html pone-chico-pc/index.html

      - name: "Fase 5 de la auditoria (10/10/2026) -- contrato de eventos: docs/eventos.md al dia con el template y los eventos reales cumplen lo que leen los scripts"
        run: node tests/probar_contrato_eventos.js la-vuelta-pc/index.html maria-laura-pc/index.html

      - name: "Fase 5 de la auditoria (10/10/2026) -- backup de Supabase: tablas descubiertas, clave privada, alerta por ntfy"
        run: python3 scripts/backup/probar_backup.py

      - name: "Fase 5 de la auditoria (10/10/2026) -- simulacro de restauracion: esquema, carga verificada, se niega a escribir en el proyecto real"
        run: python3 scripts/backup/probar_restaurar.py

  # 9/10/2026 (auditoria, hallazgo 23): antes GitHub Pages publicaba desde la rama en paralelo con
  # las pruebas, y una version con una prueba rota llegaba igual a los celulares (CI fallo 7 de 115
  # veces). Ahora se publica desde aca, y solo si el job `jsdom` paso.
  # Requiere Settings > Pages > Source = "GitHub Actions". Con "Deploy from a branch" este job falla
  # en configure-pages (y la publicacion automatica de GitHub sigue como antes).
  publicar:
    needs: jsdom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
